# 合并到 main 后自动发布到 Cloudflare Workers。
#
# 从 GitHub 的机器出网，绕开本地代理链路——本地 wrangler 频繁 520/522 时用这条路。
#
# 需要在仓库 Settings → Secrets and variables → Actions 配三个 secret：
#   CLOUDFLARE_API_TOKEN    权限：Workers Scripts:Edit + D1:Edit + Account Settings:Read
#   CLOUDFLARE_ACCOUNT_ID   账号 id
#   D1_DATABASE_ID          `wrangler d1 create subforge` 生成的库 id
#
# 这三个都不进仓库：wrangler.jsonc 里存的是占位符，cf:release 在构建前临时注入、
# 结束后无论成败都还原。SETTINGS_KEY 一类的 Worker secret 用 `wrangler secret put`
# 单独设置，重新部署会保留，不需要放进 CI。
#
# 公开仓库的安全边界（改触发条件前务必读）：
#   只用 push:main 与 workflow_dispatch，这两者都要求仓库写权限，
#   而来自 fork 的 pull_request 按 GitHub 规则一律拿不到 secret。
#   ⚠️ 绝对不要为了「给 PR 也跑一次部署」而加 pull_request_target 或
#   issue_comment —— 那两个触发器会带着 secret 执行 PR 分支上的代码，
#   等于把 token 交给任何能开 PR 的人。
name: Deploy to Cloudflare

# 最小权限：这个工作流不需要写仓库任何东西
permissions:
  contents: read

on:
  push:
    branches: [main]
    # 纯文档改动不值得跑一次发布
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch: # 也可以在 Actions 页面手动触发（比如上次发布失败后重跑）

# 同一时间只允许一次发布；新的推送排队等前一次结束，不取消它——
# 中途打断 wrangler 可能留下只传了一半的资产。
concurrency:
  group: cf-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: 类型检查与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 不把 GITHUB_TOKEN 写进 .git/config：本工作流不推任何东西，
          # 少一个凭据留在磁盘上，构建期的任意代码就少一个可偷的东西
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    name: 发布
    needs: verify # 测试没过就不发布
    runs-on: ubuntu-latest
    # 可选：到 Settings → Environments → production 加 required reviewers，
    # 就变成「合并后等人点确认再发布」。不加则维持自动发布，行为不变。
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          # 不把 GITHUB_TOKEN 写进 .git/config：本工作流不推任何东西，
          # 少一个凭据留在磁盘上，构建期的任意代码就少一个可偷的东西
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 缺 secret 时给一句人话，而不是让 wrangler 抛一个语焉不详的鉴权错。
      # 只把「有没有」的布尔结果放进 env，绝不把 secret 本身带进这一步——
      # 真正需要它的只有下面的发布步骤，暴露面越小越好。
      - name: 检查 secret 是否齐全
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          DB: ${{ secrets.D1_DATABASE_ID != '' }}
        run: |
          missing=""
          [ "$TOKEN" = "true" ]   || missing="$missing CLOUDFLARE_API_TOKEN"
          [ "$ACCOUNT" = "true" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ "$DB" = "true" ]      || missing="$missing D1_DATABASE_ID"
          if [ -n "$missing" ]; then
            echo "::error::缺少仓库 secret：$missing"
            echo "到 Settings → Secrets and variables → Actions 添加后重跑本次工作流。"
            exit 1
          fi

      - run: npm ci

      # cf:release 会：注入真实 id → 构建 core/server/web → 拷 QuickJS wasm
      # → 应用 D1 远程迁移（仅未应用的）→ wrangler deploy → 还原占位符
      - name: 构建并发布
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: npm run cf:release -w packages/server

      # wrangler.jsonc 结束时应当已被还原成占位符。真实 id 泄进仓库是不可逆的，
      # 这里兜一道：万一还原逻辑将来被改坏，让工作流红掉而不是静默带过。
      - name: 确认未泄漏真实 id
        run: |
          if ! grep -q 'REPLACE_WITH_YOUR_D1_ID' packages/server/wrangler.jsonc; then
            echo "::error::wrangler.jsonc 里的占位符没有被还原，可能残留真实 database_id"
            exit 1
          fi
          git diff --exit-code -- packages/server/wrangler.jsonc
