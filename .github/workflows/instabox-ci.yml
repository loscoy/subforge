name: InstaBox CI trial

# 仅手动运行，不接收 fork PR，不读取部署密钥。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instabox-ci-trial
  cancel-in-progress: false

jobs:
  verify:
    runs-on: [self-hosted, linux, x64, subforge-instabox-trial]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
